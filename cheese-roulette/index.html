<!doctype html>
<html lang="ko">
<head>
<!-- cheese-roulette v1.0.0 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>치즈 룰렛</title>
<style>
  :root { --bg:#14161a; --panel:#1d2025; --line:#2c3037; --text:#e8eaed; --sub:#8b919a; --accent:#00ffa3; --danger:#ff5d5d; --c1:rgb(0,255,163); --c2:rgb(255,200,61); transition:--c1 1.6s ease, --c2 1.6s ease; }
  @property --c1 { syntax:'<color>'; inherits:true; initial-value:rgb(0,255,163); }
  @property --c2 { syntax:'<color>'; inherits:true; initial-value:rgb(255,200,61); }
  * { box-sizing:border-box; }
  body { -webkit-user-select:none; user-select:none; margin:0; background:var(--bg); color:var(--text); font-family:system-ui,'Malgun Gothic',sans-serif; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  input[type=number] { -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  img, canvas, svg { -webkit-user-drag:none; user-drag:none; }
  .wrap { display:grid; grid-template-columns:var(--side-w,380px) 12px minmax(240px,1fr); grid-template-rows:minmax(0,1fr); gap:0; padding:16px; height:100vh; }
  .stage, .side { min-height:0; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:#3a3f48 transparent; }
  .side { display:flex; flex-direction:column; gap:16px; padding-right:4px; }
  .stage > *, .side > * { flex-shrink:0; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  h2 { margin:0 0 10px; font-size:14px; color:var(--sub); font-weight:600; }
  .stage { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .wheel-box { position:relative; width:min(100%, 720px, calc(100vh - 210px)); margin:auto; aspect-ratio:1; container-type:inline-size; }
  .hub { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:41%; height:12.5%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:0 3%; overflow:hidden;
    background:#12151a; border-radius:999px;
    box-shadow:0 0 0 3px var(--ring,#555), 0 0 0 7px rgba(10,12,16,.88), 0 10px 24px rgba(0,0,0,.6);
    pointer-events:none; transition:box-shadow .3s; }
  .hubtag { position:relative; font-size:1.9cqw; font-weight:800; letter-spacing:.3em; text-indent:.3em; color:#7f8793; line-height:1; }
  .hub span { position:relative; display:block; max-width:100%; text-align:center; font-weight:800; line-height:1.12; color:#fff;
    overflow-wrap:anywhere; text-shadow:0 2px 4px rgba(0,0,0,.55); }
  .hub.win { --ring:#ffd24d !important; animation:hubpop .5s cubic-bezier(.2,1.5,.4,1), hubglow 1.6s ease-in-out .5s 3; }
  .hub.win .hubtag { color:#ffd24d; }
  .hub.win span { background:linear-gradient(180deg,#fff3b0,#ffd24d 55%,#f2a900); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; }
  @keyframes hubpop { 0% { transform:translate(-50%,-50%) scale(1); } 45% { transform:translate(-50%,-50%) scale(1.18); } 100% { transform:translate(-50%,-50%) scale(1); } }
  @keyframes hubglow {
    0%, 100% { box-shadow:0 0 0 3px #ffd24d, 0 0 0 7px rgba(10,12,16,.88), 0 0 18px 4px rgba(255,210,77,.35), 0 10px 24px rgba(0,0,0,.6); }
    50% { box-shadow:0 0 0 3px #ffd24d, 0 0 0 7px rgba(10,12,16,.88), 0 0 38px 10px rgba(255,210,77,.65), 0 10px 24px rgba(0,0,0,.6); }
  }
  canvas { width:100%; height:100%; }
  .pointer { position:absolute; top:-4px; left:50%; transform:translateX(-50%); transform-origin:50% 0; width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent; border-top:28px solid #fff;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .result { display:none; min-height:40px; font-size:26px; font-weight:700; color:var(--accent); text-align:center; }
  .manual { margin-top:10px; padding:12px; border:1px solid var(--accent); border-radius:10px; background:rgba(0,255,163,.06); }
  .manual .mtitle { font-weight:700; color:var(--accent); margin-bottom:4px; }

  a.btnlike { display:inline-block; background:var(--accent); color:#04281a; font-weight:700; border-radius:6px; padding:4px 12px; text-decoration:none; }
  button.mini { padding:2px 10px; font-size:12px; }
  kbd { background:#2a2f37; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:12px; font-family:inherit; }
  #list li { max-height:60px; overflow:hidden; transition:opacity .35s, transform .35s, max-height .4s, padding .4s, border-color .4s; }
  #list li.gone { opacity:0; transform:translateX(36px); max-height:0; padding-top:0; padding-bottom:0; border-bottom-color:transparent; }
  #list li.fresh { animation:rowin .45s ease-out; }
  @keyframes rowin { from { opacity:0; transform:translateX(-24px); max-height:0; } to { opacity:1; transform:none; max-height:60px; } }
  button.warn { background:#ffd24d; color:#3b2f00; border-color:#ffd24d; font-weight:700; }
  button.spin { width:100%; padding:16px; font-size:22px; letter-spacing:.2em; border-radius:12px; }
  .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  input { flex:1; min-width:0; background:#0f1114; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px 10px; font-size:14px; }

  button.danger { color:var(--danger); }

  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; background:#2a2f37; }

  .badge.open { background:#3b320c; color:#ffd24d; }

  #list li { display:grid; grid-template-columns:14px 1fr auto auto 28px; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  #list li .dot { width:12px; height:12px; border-radius:3px; }
  #list li .name { overflow-wrap:anywhere; line-height:1.3; }
  #list li .num { color:var(--sub); font-variant-numeric:tabular-nums; }
  #list li { cursor:pointer; }
  #list li.dragging { opacity:.35; }
  #list li.dropt { outline:2px dashed var(--accent); outline-offset:-2px; background:rgba(0,255,163,.1); }
  #list li .num { cursor:text; }
  #list li .cedit { width:84px; padding:2px 6px; font-size:14px; text-align:right; border-radius:6px; }
  #list li.off .name, #list li.off .num, #list li.off .pct { opacity:.4; text-decoration:line-through; }
  #list li.off .dot { opacity:.35; }
  #list li .x { padding:0 6px; line-height:22px; }
  #list li { position:relative; padding:7px 6px; }
  #list li > * { position:relative; z-index:1; }
  #list li .bar { position:absolute; left:0; top:0; bottom:0; z-index:0; opacity:.22; border-radius:4px; pointer-events:none; transition:width .4s; }
  #list li .num { color:#c9ced6; }
  #list li .pct { font-size:17px; font-weight:800; color:#fff; min-width:58px; text-align:right; font-variant-numeric:tabular-nums; }
  #list li .unit { font-size:10px; font-weight:700; color:#ffc83d; margin-left:2px; }
  .log { max-height:120px; overflow:auto; font-size:12px; color:var(--sub); line-height:1.5; }
  .winner { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center;
    background:radial-gradient(circle at center, rgba(0,255,163,.18), rgba(0,0,0,.78) 70%); }
  .winner.show { display:flex; animation:fadein .3s ease-out; }
  .winner::before { content:''; position:absolute; left:50%; top:50%; width:170vmax; height:170vmax; margin:-85vmax 0 0 -85vmax; pointer-events:none; opacity:0;
    background:repeating-conic-gradient(from 0deg, rgba(255,210,77,.22) 0deg 7deg, transparent 7deg 20deg);
    -webkit-mask:radial-gradient(circle, #000 0, transparent 38%); mask:radial-gradient(circle, #000 0, transparent 38%); }
  .winner.show::before { opacity:1; animation:rays 14s linear infinite; }
  @keyframes rays { to { transform:rotate(360deg); } }
  .winner .card { position:relative; }
  .sw { position:relative; display:inline-block; width:44px; height:24px; flex:none; cursor:pointer; align-self:center; }
  .sw input { position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; padding:0; cursor:pointer; z-index:1; }
  .sw i { position:absolute; inset:0; border-radius:999px; background:#2a2f37; border:1px solid var(--line); transition:background .25s, border-color .25s; }
  .sw i::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#8b919a; transition:transform .25s cubic-bezier(.2,1.4,.4,1), background .25s; }
  .sw input:checked + i { background:#3b1d6e; border-color:#b57bff; }
  .sw input:checked + i::after { transform:translateX(20px); background:#d9c8ff; }
  .sw input:disabled { cursor:not-allowed; }
  .sw input:disabled + i { opacity:.5; }
  .hint { margin:0 0 0 80px; font-size:12px; line-height:1.4; color:var(--sub); }
  .hint b { color:#b57bff; }
  .chk { display:flex; align-items:flex-start; gap:8px; margin:0 0 0 80px; max-height:0; opacity:0; overflow:hidden; transform:translateY(-8px); pointer-events:none;
    transition:max-height .4s ease, opacity .3s ease, transform .35s cubic-bezier(.2,1.4,.4,1), margin-top .4s ease; color:var(--sub); font-size:13px; cursor:pointer; }
  .chk.show { max-height:60px; opacity:1; transform:none; margin-top:4px; pointer-events:auto; }
  .chk small { max-height:0; opacity:0; overflow:hidden; transition:max-height .3s ease, opacity .3s ease; }
  .chk small.show { max-height:20px; opacity:1; }
  @keyframes seqbump { 0% { transform:scale(.85); opacity:.3; filter:brightness(2); } 60% { transform:scale(1.08); } 100% { transform:none; opacity:1; filter:none; } }
  .chk small.bump { animation:seqbump .45s ease-out; }
  @keyframes inputbump { 0% { box-shadow:0 0 0 0 rgba(181,123,255,.8); } 100% { box-shadow:0 0 0 12px rgba(181,123,255,0); } }
  input.bump { animation:inputbump .5s ease-out; border-color:#b57bff; }
  .chk input { flex:none; width:16px; height:16px; min-width:0; padding:0; margin:2px 0 0; border-radius:4px; accent-color:#b57bff; cursor:pointer; }
  .chk small { display:block; color:#b57bff; font-weight:700; margin-top:2px; }
  .rerolltip { position:absolute; top:6vh; left:50%; transform:translateX(-50%); z-index:2; padding:12px 26px; border-radius:999px; white-space:nowrap;
    background:rgba(20,14,40,.92); border:2px solid #b57bff; color:#e6d6ff; font-size:clamp(18px,2.4vw,30px); font-weight:800; letter-spacing:.04em;
    box-shadow:0 0 30px rgba(181,123,255,.55); animation:tipbob 1.6s ease-in-out infinite; pointer-events:none; }
  .rerolltip b { color:#ffd24d; }
  .rerolltip[hidden] { display:none; }
  @keyframes tipbob { 0%,100% { transform:translateX(-50%) translateY(0); } 50% { transform:translateX(-50%) translateY(-6px); } }
  .winner .orb { position:absolute; font-size:44px; pointer-events:none; animation:bob 1.6s ease-in-out infinite; filter:drop-shadow(0 0 10px rgba(255,210,77,.8)); }
  .winner .orb.o1 { left:-26px; top:-30px; } .winner .orb.o2 { right:-26px; top:-34px; animation-delay:-.4s; }
  .winner .orb.o3 { left:-30px; bottom:-30px; animation-delay:-.8s; } .winner .orb.o4 { right:-30px; bottom:-30px; animation-delay:-1.2s; }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(-8deg) scale(1); } 50% { transform:translateY(-14px) rotate(10deg) scale(1.15); } }
  @keyframes goldglow { 0%,100% { box-shadow:0 0 50px rgba(255,210,77,.5), 0 0 0 0 rgba(255,210,77,.4); } 50% { box-shadow:0 0 110px rgba(255,210,77,.9), 0 0 0 14px rgba(255,210,77,0); } }
  .winner .card { text-align:center; padding:40px 64px; border-radius:20px; background:rgba(20,22,26,.92);
    border:3px solid #ffd24d; animation:pop .7s cubic-bezier(.2,1.8,.4,1), goldglow 1.4s ease-in-out .7s infinite; max-width:90vw; }
  .winner .label { font-size:26px; letter-spacing:.3em; color:#ffd24d; margin-bottom:12px; text-shadow:0 0 14px rgba(255,210,77,.8); }
  .winner .wname { font-size:clamp(40px,9vw,96px); font-weight:800; line-height:1.15; word-break:break-all;
    background:linear-gradient(90deg,#fff,#00ffa3,#ffd24d,#fff); background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
    color:transparent; animation:shine 2.5s linear infinite; }
  .winner.legend .card { border-color:#ff5d8f; background:linear-gradient(160deg,rgba(60,20,70,.96),rgba(20,22,26,.94)); }
  .winner.legend .label { color:#ff9dd1; font-size:30px; }
  .wpct.hot { color:#ffd83d; font-weight:900; font-size:1.35em; padding:1px 8px; border-radius:8px; background:rgba(255,216,61,.16); text-shadow:0 0 12px rgba(255,200,0,.9); animation:wpctPulse 1.1s ease-in-out infinite; }
  @keyframes wpctPulse { 0%,100% { box-shadow:0 0 0 0 rgba(255,216,61,.5); } 50% { box-shadow:0 0 16px 4px rgba(255,216,61,.55); } }
  body.slowmo .stage { overflow:hidden; }
  body.slowmo .wheel-box { transform:translate(0,var(--zy,0px)) scale(var(--zs,2.3)); transform-origin:50% 9%; transition:transform 3.6s cubic-bezier(.45,0,.2,1), width .5s cubic-bezier(.2,.8,.2,1); z-index:3; }
  .winner .wdon { margin-top:14px; }
  .winner .wdon[hidden] { display:none; }
  .winner .wdon .bar { display:flex; height:12px; border-radius:6px; overflow:hidden; background:#2a2f37; gap:2px; }
  .winner .wdon .bar i { display:block; height:100%; }
  .winner .wdon .txt { margin-top:8px; font-size:16px; color:var(--sub); }
  .winner .wdon .txt b { color:#fff; }
  .winner .wmeta { margin-top:14px; font-size:22px; color:var(--sub); }
  .winner button { margin-top:22px; }
  .rerollfx { position:fixed; inset:0; z-index:1060; pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:radial-gradient(circle at center, rgba(120,60,255,.1), rgba(30,8,70,.7)); animation:rfxin .25s ease-out; }
  .rerollfx::before { content:''; position:absolute; inset:0; opacity:.18; background:repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 2px, transparent 2px 6px); animation:scan .4s linear infinite; }
  .rerollfx.out { opacity:0; transition:opacity .35s; }
  .rerollfx .big { position:relative; font-size:clamp(60px,14vw,210px); font-weight:900; letter-spacing:.06em; color:#fff; line-height:1;
    text-shadow:5px 0 #00e5ff, -5px 0 #ff2bd6, 0 0 50px #b57bff; animation:rslam .5s cubic-bezier(.2,1.6,.4,1) both, rglitch .22s steps(2) .5s infinite; }
  .rerollfx .rsub { position:relative; font-size:clamp(22px,3.4vw,48px); font-weight:800; color:#ffd24d; text-shadow:0 0 22px rgba(255,210,77,.8); animation:rslam .6s .15s cubic-bezier(.2,1.6,.4,1) both; }
  .rerollfx .rwind { position:relative; font-size:clamp(30px,5vw,70px); color:#7ff; animation:rwind .5s linear infinite; text-shadow:0 0 20px #0ff; }
  .rerollfx .oracle { position:relative; margin-top:22px; max-width:min(90vw,1200px); text-align:center; padding:22px 40px; border-radius:20px;
    background:rgba(10,6,26,.78); border:1px solid rgba(255,220,130,.55); box-shadow:0 0 50px rgba(255,200,90,.3), inset 0 0 40px rgba(255,200,90,.08); }
  .rerollfx .oracle::before { content:''; position:absolute; left:50%; top:50%; width:140%; height:240%; transform:translate(-50%,-50%); z-index:-1;
    background:radial-gradient(ellipse, rgba(255,230,150,.22), transparent 65%); animation:ohalo 3s ease-in-out infinite; }
  .rerollfx .otext { font-family:'Noto Serif KR','Batang','Georgia',serif; font-size:clamp(28px,4.8vw,72px); font-weight:800; line-height:1.4; letter-spacing:.04em;
    color:#fffbe8; text-shadow:0 2px 0 rgba(0,0,0,.7), 0 0 16px rgba(255,220,130,.75), 0 0 36px rgba(255,190,80,.45); word-break:keep-all; overflow-wrap:anywhere; }
  .rerollfx .otext span { display:inline-block; opacity:0; animation:oreveal .7s ease-out forwards; }
  .rerollfx .owho { margin-top:14px; font-family:'Noto Serif KR','Batang','Georgia',serif; font-size:clamp(14px,1.8vw,24px); color:#d9c8ff; letter-spacing:.25em;
    opacity:0; animation:oreveal .8s ease-out forwards; text-shadow:0 0 16px rgba(181,123,255,.9); }
  @keyframes oreveal { from { opacity:0; transform:translateY(14px) scale(1.4); filter:blur(8px); } to { opacity:1; transform:none; filter:none; } }
  @keyframes ohalo { 0%,100% { opacity:.6; transform:translate(-50%,-50%) scale(.95); } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.08); } }
  @keyframes rfxin { from { opacity:0; } to { opacity:1; } }
  @keyframes scan { to { background-position:0 6px; } }

  @keyframes rwind { 0% { transform:translateX(14px); opacity:.2; } 50% { opacity:1; } 100% { transform:translateX(-14px); opacity:.2; } }

  .chsub { font-size:11px; color:var(--sub); }

<script>
const $ = (id) => document.getElementById(id);
document.addEventListener('dragstart', (e) => e.preventDefault());
const canvas = $('wheel');
const ctx = canvas.getContext('2d');
const KEY = 'cheese-roulette-v1';

let state = { items: [], phase: 'idle' };
let rot = 0;
let spinning = false;
const visMap = new WeakMap();
const removing = new Set();
const fresh = new Set();

function eff(it) {
  return it.off ? 0 : it.cheese;
}

function wOf(it) {
  return it.cheese * (visMap.has(it) ? visMap.get(it) : 1);
}

function tween(it, from, to, dur, done) {
  const t0 = performance.now();
  (function step(now) {
    const t = Math.min(1, Math.max(0, (now - t0) / dur));
    const e = t * t * (3 - 2 * t);
    visMap.set(it, from + (to - from) * e);
    drawWheel();
    if (t < 1) requestAnimationFrame(step);
    else if (done) done();
  })(t0);
}

let dragItem = null;

function mergeItems(src, dst) {
  if (spinning || removing.has(src) || removing.has(dst)) return;
  dst.cheese += src.cheese;
  if (src.donors) {
    dst.donors = dst.donors || {};
    for (const n in src.donors) dst.donors[n] = (dst.donors[n] || 0) + src.donors[n];
  }
  if (src.anonN) dst.anonN = (dst.anonN || 0) + src.anonN;
  log(`합치기: ${src.name} (${src.cheese.toLocaleString()}) -> ${dst.name}`);
  save();
  removeItem(src, null);
  render();
}

function editCheese(it, cell) {
  if (spinning || removing.has(it) || cell.querySelector('input')) return;
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.inputMode = 'numeric';
  inp.className = 'cedit';
  inp.value = String(it.cheese);
  cell.textContent = '';
  cell.appendChild(inp);
  inp.focus();
  inp.select();
  let done = false;
  const end = (ok) => {
    if (done) return;
    done = true;
    const v = parseInt(inp.value.replace(/[^\d]/g, ''), 10);
    if (ok && Number.isFinite(v) && v !== it.cheese) {
      log(`수정: ${it.name} ${it.cheese.toLocaleString()} -> ${v.toLocaleString()}치즈`);
      it.cheese = v;
      save();
    }
    render();
  };
  inp.onclick = (e) => e.stopPropagation();
  inp.onkeydown = (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter') end(true);
    else if (e.key === 'Escape') end(false);
  };
  inp.onblur = () => end(true);
}

function toggleOff(it) {
  if (spinning || removing.has(it)) return;
  it.off = !it.off;
  save();
  render();
  tween(it, visMap.has(it) ? visMap.get(it) : 1, it.off ? 0 : 1, 400, () => {
    if (it.off) visMap.set(it, 0);
    else visMap.delete(it);
  });
}

function removeItem(it, li) {
  if (spinning || removing.has(it)) return;
  removing.add(it);
  if (li) li.classList.add('gone');
  tween(it, visMap.has(it) ? visMap.get(it) : 1, 0, 450, () => {
    removing.delete(it);
    state.items = state.items.filter((x) => x !== it);
    save();
    render();
  });
}

try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved.items)) state = saved;
} catch {}
state.phase = 'idle';
state.items.forEach((it) => { if (it.off) visMap.set(it, 0); });

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

function normalize(s) {
  return s.trim().replace(/\s+/g, ' ');
}

function colorOf(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 65% 52%)`;
}

const PALETTE = [
  '#e63946', '#2a9df4', '#f59e0b', '#8e44ad', '#2ecc71',
  '#ff5fa2', '#00bcd4', '#ff7a30', '#5b5fef', '#7cb518',
  '#d81b60', '#009688', '#fbc02d', '#6d4c41', '#3f51b5',
  '#ef5350', '#43a047', '#ab47bc', '#546e7a', '#c0ca33',
];

function itemColor(it) {
  return PALETTE[(it.ci || 0) % PALETTE.length];
}

function isLight(c) {
  let m = c.match(/^#([0-9a-f]{6})$/i);
  if (m) {
    const n = parseInt(m[1], 16);
    return 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 170;
  }
  m = c.match(/hsl\(\s*[\d.]+\s+[\d.]+%\s+([\d.]+)%/);
  return m ? parseFloat(m[1]) > 62 : false;
}

function amountTier(a) { return a >= 50000 ? 3 : a >= 10000 ? 2 : a >= 5000 ? 1 : 0; }

function screenFlash(color, peak) {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;inset:0;z-index:1050;pointer-events:none;background:${color}`;
  document.body.appendChild(el);
  if (!el.animate) return el.remove();
  el.animate([{ opacity: peak }, { opacity: 0 }], { duration: 700, easing: 'ease-out' }).onfinish = () => el.remove();
  setTimeout(() => el.remove(), 1200);
}

function shake(el) {
  if (!el || !el.animate) return;
  el.animate([
    { transform: 'translate(0,0)' }, { transform: 'translate(-9px,5px)' }, { transform: 'translate(8px,-6px)' },
    { transform: 'translate(-6px,-4px)' }, { transform: 'translate(5px,6px)' }, { transform: 'translate(0,0)' },
  ], { duration: 450, iterations: 2 });
}

function cheeseRain(n) {
  const box = $('cheeseFx');
  if (!box || !box.animate) return;
  const w = box.clientWidth || 600, h = box.clientHeight || 600;
  for (let k = 0; k < n; k++) {
    const el = document.createElement('i');
    el.textContent = k % 5 === 0 ? '\u2728' : '\u{1F9C0}';
    el.style.cssText = `left:${Math.random() * w}px;top:-60px;font-size:${24 + Math.random() * 34}px`;
    box.appendChild(el);
    const dur = 1800 + Math.random() * 1600;
    el.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${(Math.random() - 0.5) * 160}px,${h + 90}px) rotate(${(Math.random() - 0.5) * 720}deg)`, opacity: 1 },
    ], { duration: dur, delay: Math.random() * 1500, easing: 'cubic-bezier(.3,.1,.7,.9)', fill: 'both' }).onfinish = () => el.remove();
    setTimeout(() => el.remove(), dur + 3200);
  }
}

function coinSound(amount) {
  const tier = amountTier(amount || 0);
  const a = audio(), t = a.currentTime + 0.02;
  const brass = (f, d, dur, v) => { tone(f, t + d, dur, 'sawtooth', v); tone(f * 2, t + d, dur, 'square', v * 0.35); };
  if (tier === 0) {
    [[1318.5, 0], [1760, 0.07], [2637, 0.14]].forEach(([f, d]) => tone(f, t + d, 0.35, 'triangle', 0.18));
  } else if (tier === 1) {
    [1046.5, 1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => tone(f, t + i * 0.055, 0.45, 'triangle', 0.16));
    [4186, 5274].forEach((f, i) => tone(f, t + 0.35 + i * 0.06, 0.4, 'sine', 0.07));
  } else if (tier === 2) {
    brass(392, 0, 0.12, 0.11);
    brass(392, 0.14, 0.12, 0.11);
    brass(523.25, 0.28, 0.3, 0.13);
    [523.25, 659.25, 783.99, 1046.5].forEach((f) => brass(f, 0.65, 1.0, 0.09));
    [1568, 2093, 2637, 3136, 4186].forEach((f, i) => tone(f, t + 0.65 + i * 0.07, 0.5, 'triangle', 0.09));
    crash(t + 0.65);
  } else {
    for (let i = 0; i < 8; i++) tone(98 * (i % 2 ? 1 : 1.12), t + i * 0.06, 0.2, 'sine', 0.3 - i * 0.02);
    brass(392, 0.4, 0.12, 0.12);
    brass(392, 0.54, 0.12, 0.12);
    brass(392, 0.68, 0.12, 0.12);
    brass(523.25, 0.82, 0.3, 0.14);
    [523.25, 659.25, 783.99, 1046.5].forEach((f) => brass(f, 1.25, 1.3, 0.1));
    [1046.5, 1318.5, 1568, 2093, 1568, 2093, 2637, 3136, 4186].forEach((f, i) => tone(f, t + 1.25 + i * 0.07, 0.5, 'triangle', 0.09));
    [698.46, 880, 1046.5, 1396.9].forEach((f) => brass(f, 2.1, 1.2, 0.09));
    crash(t + 1.25);
    crash(t + 2.1);
  }
}

function cheeseRing(box, w) {
  const ring = document.createElement('i');
  ring.style.cssText = `left:50%;bottom:0;width:${w * 0.25}px;height:${w * 0.25}px;margin-left:${-w * 0.125}px;margin-bottom:${-w * 0.125}px;`
    + 'border-radius:50%;border:5px solid #ff9d3d;box-shadow:0 0 36px #ff9d3d;';
  box.appendChild(ring);
  if (!ring.animate) return ring.remove();
  ring.animate([{ transform: 'scale(.2)', opacity: 1 }, { transform: 'scale(5)', opacity: 0 }], { duration: 1100, easing: 'ease-out' }).onfinish = () => ring.remove();
}

function tierShow(tier) {
  const W = innerWidth, H = innerHeight;
  if (tier === 1) firework(W * (0.3 + Math.random() * 0.4), H * 0.35);
  if (tier === 2) {
    screenFlash('radial-gradient(circle,rgba(255,210,77,.55),transparent 70%)', 0.8);
    [0, 250, 500].forEach((d, i) => setTimeout(() => firework(W * (0.25 + i * 0.25), H * (0.3 + (i % 2) * 0.12)), d));
  }
  if (tier === 3) {
    screenFlash('rgba(255,255,255,.75)', 0.9);
    shake(document.querySelector('.left'));
    burst();
    setTimeout(burst, 500);
    for (let i = 0; i < 8; i++) setTimeout(() => firework(W * (0.1 + Math.random() * 0.8), H * (0.15 + Math.random() * 0.45)), i * 280);
    cheeseRain(70);
  }
}

function cheeseBurst(amount) {
  const box = $('cheeseFx');
  if (!box || !box.animate) return;
  const w = box.clientWidth || 600, h = box.clientHeight || 600;
  const tier = amountTier(amount || 0);
  if (tier) tierShow(tier);
  const n = Math.round((34 + Math.min(40, Math.floor((amount || 0) / 300))) * [1, 1.4, 2, 3][tier]);
  const glyphs = ['\u{1F9C0}', '\u{1F9C0}', '\u{1F9C0}', '\u{1F9C0}', '✨', '⭐'];
  const ring = document.createElement('i');
  ring.style.cssText = `left:50%;bottom:0;width:${w * 0.25}px;height:${w * 0.25}px;margin-left:${-w * 0.125}px;margin-bottom:${-w * 0.125}px;`
    + 'border-radius:50%;border:4px solid #ffd24d;box-shadow:0 0 30px #ffd24d;';
  box.appendChild(ring);
  ring.animate([{ transform: 'scale(.2)', opacity: 0.9 }, { transform: 'scale(4)', opacity: 0 }], { duration: 900, easing: 'ease-out' }).onfinish = () => ring.remove();
  for (let r = 1; r <= tier; r++) setTimeout(() => cheeseRing(box, w), r * 220);
  const spawn = (k) => {
    const el = document.createElement('i');
    const g = glyphs[Math.floor(Math.random() * glyphs.length)];
    el.textContent = g;
    const size = (g === '\u{1F9C0}' ? 26 : 18) + Math.random() * (g === '\u{1F9C0}' ? 40 : 22);
    const src = k % 3;
    const x0 = src === 0 ? w * 0.04 : src === 1 ? w * 0.96 : w * (0.3 + Math.random() * 0.4);
    el.style.cssText = `left:${x0}px;top:${h - 16}px;font-size:${size}px`;
    box.appendChild(el);
    const dx = src === 0 ? w * (0.15 + Math.random() * 0.6) : src === 1 ? -w * (0.15 + Math.random() * 0.6) : (Math.random() - 0.5) * w * 0.9;
    const up = h * (0.45 + Math.random() * 0.55);
    const rot = (Math.random() - 0.5) * 900;
    const dur = (1200 + Math.random() * 900) / 0.75;
    const a = el.animate([
      { transform: 'translate(0,0) rotate(0deg) scale(.3)', opacity: 1 },
      { transform: `translate(${dx * 0.55}px,${-up}px) rotate(${rot * 0.5}deg) scale(1.25)`, opacity: 1, offset: 0.42, easing: 'ease-in' },
      { transform: `translate(${dx}px,${h * 0.15}px) rotate(${rot}deg) scale(.9)`, opacity: 0 },
    ], { duration: dur, delay: Math.random() * 300, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'both' });
    a.onfinish = () => el.remove();
    setTimeout(() => el.remove(), dur + 700);
  };
  let kk = 0;
  const chunk = () => {
    const end = Math.min(n, kk + 30);
    for (; kk < end; kk++) spawn(kk);
    if (kk < n) requestAnimationFrame(chunk);
  };
  chunk();
}

function showGain(it, amount, isNew, beforePct, afterPct) {
  const box = $('gains');
  if (!box) return;
  const el = document.createElement('div');
  const tier = amountTier(amount);
  el.className = 'gain' + (tier ? ' t' + tier : '');
  el.style.setProperty('--gc', itemColor(it));
  const f = (v) => v.toFixed(1) + '%';
  const diff = afterPct - beforePct;
  const pct = isNew ? f(afterPct) : f(afterPct) + `<small class="${diff < 0 ? 'neg' : ''}">${f(beforePct)} → ${f(afterPct)} (${diff >= 0 ? '+' : ''}${diff.toFixed(1)}%p)</small>`;
  el.innerHTML = `<span class="tag ${isNew ? '' : amount < 0 ? 'sub' : 'add'}">${isNew ? 'NEW' : amount < 0 ? '차감' : '추가'}</span><span class="gname"></span><span class="gamt">${amount < 0 ? '' : '+'}${amount.toLocaleString()}치즈</span><span class="gpct">${pct}</span>`;
  el.querySelector('.gname').textContent = it.name;
  box.prepend(el);
  while (box.children.length > 3) box.lastChild.remove();
  const life = tier >= 3 ? 6200 : tier === 2 ? 5000 : 3600;
  setTimeout(() => el.classList.add('out'), life);
  setTimeout(() => el.remove(), life + 400);
}

function addCheese(name, amount, nick) {
  const key = normalize(name).toLowerCase();
  const found = state.items.find((i) => i.key === key);
  const before = state.items.reduce((a, i) => a + eff(i), 0);
  const beforePct = found && before ? (eff(found) / before) * 100 : 0;
  let target = found;
  if (found) found.cheese += amount;
  else {
    const ci = state.nextCi || 0;
    state.nextCi = ci + 1;
    const it = { key, name: normalize(name), cheese: amount, ci, donors: {} };
    target = it;
    state.items.push(it);
    visMap.set(it, 0);
    fresh.add(it);
    tween(it, 0, 1, 500, () => visMap.delete(it));
  }
  if (nick !== undefined) {
    if (nick && !nick.includes('익명')) {
      target.donors = target.donors || {};
      target.donors[nick] = (target.donors[nick] || 0) + amount;
    } else target.anonN = (target.anonN || 0) + 1;
  }
  save();
  render();
  const after = state.items.reduce((a, i) => a + eff(i), 0);
  showGain(target, amount, !found, beforePct, after ? (eff(target) / after) * 100 : 0);
  requestAnimationFrame(() => {
    cheeseBurst(amount);
    setTimeout(() => { try { coinSound(amount); } catch {} }, 0);
  });
}

function subCheese(name, amount) {
  const key = normalize(name).toLowerCase();
  const found = state.items.find((i) => i.key === key);
  if (!found) return log(`차감 실패(항목 없음): ${normalize(name)}`);
  if (spinning || removing.has(found)) return log('차감 실패(돌리는 중 또는 삭제 중)');
  const before = state.items.reduce((a, i) => a + eff(i), 0);
  const beforePct = (eff(found) / before) * 100;
  const left = Math.max(0, found.cheese - amount);
  const applied = found.cheese - left;
  const afterTotal = before - (found.off ? 0 : applied);
  found.cheese = left;
  save();
  render();
  log(applied < amount ? `차감: ${found.name} -${amount.toLocaleString()}치즈 (보유분 ${applied.toLocaleString()} 차감, 0으로)` : `차감: ${found.name} -${applied.toLocaleString()}치즈${left === 0 ? ' (0)' : ''}`);
  showGain(found, -applied, false, beforePct, afterTotal ? ((found.off ? 0 : left) / afterTotal) * 100 : 0);
  try { subSound(); } catch {}
}

function subSound() {
  const a = audio(), t = a.currentTime + 0.02;
  [[784, 0], [659.25, 0.08], [523.25, 0.16], [392, 0.24]].forEach(([f, d]) => tone(f, t + d, 0.3, 'triangle', 0.15));
}

function log(text) {
  const el = document.createElement('div');
  el.textContent = `[${new Date().toLocaleTimeString('ko-KR')}] ${text}`;
  $('log').prepend(el);
  while ($('log').children.length > 50) $('log').lastChild.remove();
}

let zoomItem = null, wheelOff = null, wheelSig = '';
function renderWheel(g, rotVal, total) {
  const W = canvas.width, c = W / 2, r = c - 10;
  let a = rotVal, hl = null;
  for (const it of state.items) {
    const span = (wOf(it) / total) * Math.PI * 2;
    if (span < 1e-6) continue;
    g.beginPath();
    g.moveTo(c, c);
    g.arc(c, c, r, a, a + span);
    g.closePath();
    g.globalAlpha = highlight && highlight !== it ? 0.3 : 1;
    g.fillStyle = itemColor(it);
    g.fill();
    g.strokeStyle = '#14161a';
    g.lineWidth = 3;
    g.stroke();

    const mid = a + span / 2;
    const hubR = 1 / Math.sqrt((Math.cos(mid) / (W * 0.205)) ** 2 + (Math.sin(mid) / (W * 0.065)) ** 2);
    const outer = r - 22, inner = hubR + 16, maxW = outer - inner;
    const isZ = zoomItem === it, minFs = isZ ? 16 : 8;
    let fs = Math.min(40, span * ((inner + outer) / 2) * 0.82);
    if (isZ) fs = Math.max(fs, minFs);
    if (fs >= minFs && maxW > 40) {
      g.save();
      g.translate(c, c);
      g.rotate(mid);
      g.textAlign = 'right';
      g.textBaseline = 'middle';
      g.font = `bold ${fs}px sans-serif`;
      const w = g.measureText(it.name).width;
      if (w > maxW) {
        fs = Math.max(minFs, fs * (maxW / w));
        g.font = `bold ${fs}px sans-serif`;
      }
      let label = it.name;
      while (label.length > 1 && g.measureText(label).width > maxW) label = label.slice(0, -1);
      if (label !== it.name) label = label.slice(0, -1) + '\u2026';
      const lt = isLight(itemColor(it));
      g.lineJoin = 'round';
      g.lineWidth = Math.max(3, fs * 0.16);
      g.strokeStyle = lt ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.4)';
      g.strokeText(label, outer, 0);
      g.fillStyle = lt ? '#14161a' : '#fff';
      g.fillText(label, outer, 0);
      g.restore();
    }
    if (it === highlight) hl = [a, span];
    g.globalAlpha = 1;
    a += span;
  }
  if (hl) {
    g.beginPath();
    g.moveTo(c, c);
    g.arc(c, c, r, hl[0], hl[0] + hl[1]);
    g.closePath();
    g.strokeStyle = '#fff';
    g.lineWidth = 6;
    g.lineJoin = 'round';
    g.stroke();
  }
}

function drawWheel() {
  const W = canvas.width, c = W / 2;
  const total = state.items.reduce((a, i) => a + wOf(i), 0);

  if (total < 1e-6) {
    ctx.clearRect(0, 0, W, W);
    ctx.fillStyle = '#2a2f37';
    ctx.beginPath(); ctx.arc(c, c, c - 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8b919a';
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('항목 없음', c, c + 14);
    updateHub(0);
    return;
  }

  if (spinning) {
    let h = state.items.length;
    for (let k = 0; k < state.items.length; k++) {
      const it = state.items[k];
      h = (h * 31 + Math.round(wOf(it) * 1000)) | 0;
      if (it === highlight) h = (h * 31 + k + 7) | 0;
      if (it === zoomItem) h = (h * 31 + k + 13) | 0;
    }
    const sig = W + ':' + h;
    if (!wheelOff || wheelOff.width !== W) {
      wheelOff = document.createElement('canvas');
      wheelOff.width = wheelOff.height = W;
      wheelSig = '';
    }
    if (sig !== wheelSig) {
      const g = wheelOff.getContext('2d');
      g.clearRect(0, 0, W, W);
      renderWheel(g, 0, total);
      wheelSig = sig;
    }
    ctx.clearRect(0, 0, W, W);
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(rot);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(wheelOff, -c, -c);
    ctx.restore();
  } else {
    ctx.clearRect(0, 0, W, W);
    renderWheel(ctx, rot, total);
  }
  updateHub(total);
}

function render() {
  const total = state.items.reduce((a, i) => a + eff(i), 0);

  const list = $('list');
  list.innerHTML = '';
  const sorted = [...state.items].sort((x, y) => y.cheese - x.cheese);
  for (const it of sorted) {
    const li = document.createElement('li');
    if (removing.has(it)) li.classList.add('gone');
    else if (fresh.has(it)) { li.classList.add('fresh'); fresh.delete(it); }
    const pct = total && !it.off ? ((eff(it) / total) * 100).toFixed(1) : '0.0';
    li.innerHTML = '<span class="dot"></span><span class="name"></span><span class="num"></span><span class="num"></span><button class="x danger">×</button>';
    li.children[0].style.background = itemColor(it);
    li.children[1].textContent = it.name;
    li.children[1].title = it.name;
    li.children[2].textContent = it.cheese.toLocaleString();
    const un = document.createElement('small');
    un.className = 'unit';
    un.textContent = '치즈';
    li.children[2].appendChild(un);
    li.children[3].textContent = pct + '%';
    li.children[3].className = 'pct';
    li.children[4].onclick = (e) => { e.stopPropagation(); removeItem(it, li); };
    if (it.off) li.classList.add('off');
    li.title = it.off ? '클릭: 룰렛에 다시 포함' : '클릭: 룰렛에서 임시 제외';
    li.onclick = () => toggleOff(it);
    li.draggable = true;
    li.ondragstart = (e) => {
      if (spinning || removing.has(it)) return e.preventDefault();
      dragItem = it;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', it.name); } catch {}
      li.classList.add('dragging');
    };
    li.ondragend = () => {
      dragItem = null;
      document.querySelectorAll('#list li.dragging, #list li.dropt').forEach((n) => n.classList.remove('dragging', 'dropt'));
    };
    li.ondragover = (e) => {
      if (!dragItem || dragItem === it || spinning || removing.has(it)) return;
      e.preventDefault();
      li.classList.add('dropt');
    };
    li.ondragleave = () => li.classList.remove('dropt');
    li.ondrop = (e) => {
      e.preventDefault();
      li.classList.remove('dropt');
      const src = dragItem;
      dragItem = null;
      if (src && src !== it) mergeItems(src, it);
    };
    li.children[2].title = '클릭: 치즈 수정';
    li.children[2].onclick = (e) => { e.stopPropagation(); editCheese(it, li.children[2]); };
    const bar = document.createElement('i');
    bar.className = 'bar';
    bar.style.width = pct + '%';
    bar.style.background = itemColor(it);
    li.appendChild(bar);
    list.appendChild(li);
  }

  const ph = $('phase');
  ph.textContent = { idle: '대기', open: '접수 중', closed: '마감' }[state.phase];
  ph.className = 'badge' + (state.phase === 'open' ? ' open' : '');
  const bt = $('btnStart');
  bt.textContent = state.phase === 'open' ? '마감' : '접수';
  bt.className = state.phase === 'open' ? 'warn' : 'primary';
  bt.disabled = spinning;
  const st = $('btnStop');
  st.hidden = !spinning || spinPhase === 'rewind';
  st.disabled = spinPhase === 'stopping' || performance.now() < stopOkAt;
  st.textContent = spinPhase === 'stopping' ? '멈추는 중...' : '멈춤';
  document.body.classList.toggle('accepting', state.phase === 'open');
  $('btnDisc').disabled = state.phase === 'open';
  $('minAmt').disabled = state.phase === 'open';
  $('rerollAmt').disabled = state.phase === 'open';
  $('rerollInc').disabled = state.phase === 'open';
  $('subOn').disabled = state.phase === 'open';
  document.body.classList.toggle('spinning', spinning && spinPhase !== 'rewind');
  syncBgm();
  updateHud();
  $('btnSpin').hidden = spinning;
  $('btnSpin').disabled = state.phase === 'open' || spinning || !total;
  drawWheel();
}

let highlight = null;
let hubItem;

function fitHub(el, hub) {
  const cw = hub.clientWidth, ch = hub.clientHeight;
  if (!cw) return;
  const maxH = ch * 0.62, min = cw * 0.075;
  let size = cw * 0.15;
  el.style.fontSize = size + 'px';
  while (el.offsetHeight > maxH && size > min) {
    size -= 1.5;
    el.style.fontSize = size + 'px';
  }
}

window.addEventListener('resize', () => fitHub($('hubName'), $('hub')));

function updateHub(total) {
  const hub = $('hub'), nameEl = $('hubName');
  if (highlight && !state.items.includes(highlight)) highlight = null;
  const item = total ? state.items[segIndexAt(rot, total)] : null;
  const isWin = !!highlight && !spinning;
  hub.classList.toggle('win', isWin);
  $('hubTag').textContent = isWin ? 'WINNER' : 'NOW';
  if (item === hubItem) return;
  const oldText = nameEl.textContent, oldSize = nameEl.style.fontSize, oldW = nameEl.offsetWidth;
  hubItem = item;
  nameEl.textContent = item ? item.name : '-';
  hub.style.setProperty('--ring', item ? itemColor(item) : '#555');
  fitHub(nameEl, hub);
  if (spinning) {
    const dur = 110, dy = hub.clientHeight;
    nameEl.animate(
      [{ transform: 'translateY(-100%)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1, offset: 0.7 }, { transform: 'translateY(0)', opacity: 1 }],
      { duration: dur, easing: 'ease-out' }

      else fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      fctx.restore();
      continue;
    }
    if (!p.sucked) (p.hist || (p.hist = [])).push(p.x, p.y, p.rot);
    if (p.sucked) {
      const dx = cx - p.x, dy = cy - p.y, dist = Math.hypot(dx, dy) || 1;
      p.vx = (p.vx + (dx / dist) * 3.2) * 0.9;
      p.vy = (p.vy + (dy / dist) * 3.2) * 0.9;
      p.w *= 0.985;
      if (dist < 40) p.life = 9999;
    } else {
      p.vx *= 0.99;
      p.vy = Math.min(p.vy + p.g, 9);
    }
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life++;
    fctx.save();
    fctx.translate(p.x, p.y);
    fctx.rotate(p.rot);
    fctx.fillStyle = p.color;
    if (p.fade) fctx.globalAlpha = Math.max(0, 1 - p.life / 110);
    if (p.round) { fctx.beginPath(); fctx.arc(0, 0, p.w / 2, 0, 6.3); fctx.fill(); }
    else fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    fctx.restore();
  }
  if (parts.length) requestAnimationFrame(stepFx);
  else fxRun = false;
}

function segIndexAt(rotNow) {
  const TAU = Math.PI * 2;
  const tw = state.items.reduce((a, i) => a + wOf(i), 0);

  for (let i = 0; i < state.items.length; i++) {

function rewindSound(dur) {
  const a = audio(), t = a.currentTime, o = out();
  const m = a.createOscillator(), mg = a.createGain();
  m.type = 'sawtooth';
  m.frequency.setValueAtTime(300, t);
  m.frequency.exponentialRampToValueAtTime(1500, t + dur * 0.35);
  m.frequency.setValueAtTime(1500, t + dur * 0.7);
  m.frequency.exponentialRampToValueAtTime(260, t + dur);
  mg.gain.setValueAtTime(0.0001, t);
  mg.gain.linearRampToValueAtTime(0.06, t + 0.15);
  mg.gain.setValueAtTime(0.06, t + dur - 0.2);
  mg.gain.linearRampToValueAtTime(0.0001, t + dur);
  m.connect(mg).connect(o);
  m.start(t);
  m.stop(t + dur + 0.05);

  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf;
  f.type = 'bandpass';
  f.Q.value = 1.2;
  f.frequency.setValueAtTime(1200, t);
  f.frequency.exponentialRampToValueAtTime(5000, t + dur * 0.35);
  f.frequency.setValueAtTime(5000, t + dur * 0.7);
  f.frequency.exponentialRampToValueAtTime(900, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.18, t + 0.15);
  g.gain.setValueAtTime(0.18, t + dur - 0.2);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(o);
  src.start(t);
  src.stop(t + dur + 0.05);

  const c = a.createOscillator(), cg = a.createGain();
  c.type = 'square';
  c.frequency.value = 120;
  cg.gain.setValueAtTime(0.0001, t + dur);
  cg.gain.linearRampToValueAtTime(0.15, t + dur + 0.005);
  cg.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.08);
  c.connect(cg).connect(o);
  c.start(t + dur);
  c.stop(t + dur + 0.1);
}

function rewind(startRot) {
  if (spinning || removing.size) return;
  absorb();
  const TAU = Math.PI * 2, DUR = 1.9;
  const from = rot;
  const back = ((((from - startRot) % TAU) + TAU) % TAU) + TAU * 3;
  let lastSeg = segIndexAt(rot);
  closeWinner();
  highlight = null;
  spinning = true;
  spinPhase = 'rewind';
  document.body.classList.add('focus');
  $('result').textContent = '';
  log('되감기');
  render();
  rewindSound(DUR);
  const t0 = performance.now();
  (function frame(now) {
    const t = Math.min(1, (now - t0) / (DUR * 1000));
    const e = 0.5 - Math.cos(Math.PI * t) / 2;
    rot = from - back * e;
    const seg = segIndexAt(rot);
    if (seg !== lastSeg) { tick(); lastSeg = seg; }
    drawWheel();
    if (t < 1) return requestAnimationFrame(frame);
    rot = ((startRot % TAU) + TAU) % TAU;
    drawWheel();
    setTimeout(() => {
      spinning = false;
      spinPhase = '';
      spin();
      if (!spinning) {
        document.body.classList.remove('focus');
        render();
      }
    }, 1000);
  })(t0);
}

function spin() {
  const total = state.items.reduce((a, i) => a + eff(i), 0);
  if (!total || spinning || removing.size) return;

  const TAU = Math.PI * 2, VMAX = 20;
  let v = 0, last = performance.now(), dec = null;
  let lastSeg = segIndexAt(rot);
  const startRot = rot;
  lastStartRot = startRot;

  hideRetry();
  highlight = null;
  stopReq = false;
  spinPhase = 'free';
  closeWinner();
  audio();
  spinning = true;
  stopOkAt = performance.now() + 3000;
  setTimeout(render, 3050);
  document.body.classList.add('focus');
  $('result').textContent = '';
  render();

  function beginStop(now) {
    let pick = Math.random() * total, winner = state.items.find((x) => !x.off) || state.items[0], before = 0;
    for (const it of state.items) {
      const e = eff(it);
      if (!e) continue;
      if (pick < e) { winner = it; break; }
      pick -= e;
      before += e;
    }
    const pos = ((before + winner.cheese * (0.1 + Math.random() * 0.8)) / total) * TAU;
    const desired = (((-Math.PI / 2 - pos) % TAU) + TAU) % TAU;
    const d = (((desired - rot) % TAU) + TAU) % TAU;
    const v0 = Math.max(v, 6);
    const rare = (winner.cheese / total) * 100 < 1;
    const k = Math.max(1, Math.round(((v0 * (rare ? 1.5 : 1.9)) - d) / TAU));
    const D = d + k * TAU;
    const pw = rare ? 6 : 4;
    dec = { start: rot, D, T: ((pw * D) / v0) * 1000, t0: now, winner, rare, pw };
    spinPhase = 'stopping';
    render();
  }

  function finish() {
    const winner = dec.winner;
    rot = rot % TAU;
    spinning = false;
    spinPhase = '';
    stopReq = false;
    highlight = winner;
    document.body.classList.remove('focus');
    $('result').textContent = winner.name;
    log(`당첨: ${winner.name}`);
    render();
    let near = false;
    {
      const ang = (((-Math.PI / 2 - rot) % TAU) + TAU) % TAU;
      let acc = 0;
      for (const it of state.items) {
        const span = (it.cheese / total) * TAU;
        if (it === winner) {
          const fr = (ang - acc) / span;
          near = Math.min(fr, 1 - fr) * span < 0.035;
          break;
        }
        acc += span;
      }
    }
    const rare = dec.rare;
    if (rare) { legendFanfare(); celebrate(); setTimeout(celebrate, 1500); } else fanfare();
    if (!rare) celebrate();
    setTimeout(() => { document.body.classList.remove('slowmo'); zoomItem = null; }, 1000);
    if (near) setTimeout(() => { try { nearSound(); } catch {} shake(document.querySelector('.left')); }, 700);
    setTimeout(() => showWinner(winner, total, { rare }), 350);
    offerRetry(startRot);
  }

  (function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!dec) {
      v = Math.min(VMAX, v + (VMAX / 1.2) * dt);
      rot += v * dt;
      if (stopReq && performance.now() >= stopAt) beginStop(now);
    } else {
      const t = Math.min(1, (now - dec.t0) / dec.T);
      rot = dec.start + dec.D * (1 - Math.pow(1 - t, dec.pw));
      if (dec.rare && t > 0.45 && !document.body.classList.contains('slowmo')) {
        const wb = document.querySelector('.wheel-box').getBoundingClientRect(), lf = document.querySelector('.left').getBoundingClientRect();
        const zs = Math.max(1.15, Math.min(2.3, lf.width / (wb.width * 0.5), lf.height / (wb.width * 0.42)));
        document.body.style.setProperty('--zs', zs.toFixed(2));
        document.body.style.setProperty('--zy', (lf.top + lf.height / 2 - (wb.top + wb.height * 0.09)) + 'px');
        zoomItem = dec.winner;
        document.body.classList.add('slowmo');
        try { bgmSlowDown(3600); } catch {}
      }
      if (t >= 1) {
        drawWheel();
        return finish();
      }
    }
    const seg = segIndexAt(rot);
    if (seg !== lastSeg) { tick(); lastSeg = seg; }
    drawWheel();
    requestAnimationFrame(frame);
  })(last);
}

function pickColors(im) {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const x = c.getContext('2d');
  x.drawImage(im, 0, 0, 32, 32);
  const d = x.getImageData(0, 0, 32, 32).data;
  const B = 24, sum = new Array(B).fill(0), acc = Array.from({ length: B }, () => [0, 0, 0]);
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 200) continue;
    const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dl = mx - mn;
    if (dl < 0.12 || l < 0.12 || l > 0.92) continue;
    const sat = dl / (1 - Math.abs(2 * l - 1));
    let h = mx === r ? ((g - b) / dl) % 6 : mx === g ? (b - r) / dl + 2 : (r - g) / dl + 4;
    h = (h * 60 + 360) % 360;
    const w = sat * (1 - Math.abs(2 * l - 1));
    const k = Math.floor(h / (360 / B)) % B;
    sum[k] += w;
    acc[k][0] += d[i] * w; acc[k][1] += d[i + 1] * w; acc[k][2] += d[i + 2] * w;
  }
  let best = 0;
  for (let k = 1; k < B; k++) if (sum[k] > sum[best]) best = k;
  if (sum[best] < 1) return null;
  const rgb = acc[best].map((v) => v / sum[best]);
  const vivid = (rgbv, dh) => {
    const [r, g, b] = rgbv.map((v) => v / 255);
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), dl = mx - mn;
    let h = dl === 0 ? 0 : mx === r ? ((g - b) / dl) % 6 : mx === g ? (b - r) / dl + 2 : (r - g) / dl + 4;
    h = (h * 60 + 360 + dh) % 360;
    const f = (n) => { const k = (n + h / 30) % 12; return Math.round((0.55 - 0.45 * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255); };
    return `${f(0)},${f(8)},${f(4)}`;
  };
  return [vivid(rgb, 0), vivid(rgb, 40)];
}

function loadImg(src, cors) {
  return new Promise((res, rej) => {
    const im = new Image();
    if (cors) im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = rej;
    im.referrerPolicy = 'no-referrer';
    im.src = src;
  });
}

const AMB_KEY = 'cheese-roulette-amb';

async function applyAmbient(url) {
  if (url === ambUrl) return;
  ambUrl = url;
  const root = document.documentElement.style;
  const set = (cols) => {
    if (ambUrl !== url) return;
    if (cols) { root.setProperty('--c1', `rgb(${cols[0]})`); root.setProperty('--c2', `rgb(${cols[1]})`); }
    else { root.removeProperty('--c1'); root.removeProperty('--c2'); }
  };
  if (!url) return set(null);
  try {
    const c = JSON.parse(localStorage.getItem(AMB_KEY));
    if (c && c.url === url && c.cols) return set(c.cols);
  } catch {}
  const clean = url.replace(/^https?:\/\//, '');
  const viaProxy = (mk) => async () => {
    const resp = await fetch(mk(), { signal: AbortSignal.timeout(6000) });
    if (!resp.ok) throw new Error('http');
    const obj = URL.createObjectURL(await resp.blob());
    try { return pickColors(await loadImg(obj, false)); } finally { URL.revokeObjectURL(obj); }
  };
  const tries = [
    async () => pickColors(await loadImg(url, true)),
    viaProxy(() => 'https://wsrv.nl/?url=' + encodeURIComponent(clean) + '&w=64&h=64&output=png'),
    viaProxy(() => 'https://images.weserv.nl/?url=' + encodeURIComponent(clean) + '&w=64&h=64&output=png'),
    viaProxy(() => ROUTES[1][1](url)),
    viaProxy(() => ROUTES[2][1](url)),
  ];
  try {
    const cols = await Promise.any(tries.map((f) => f().then((c) => { if (!c) throw new Error('none'); return c; })));
    try { localStorage.setItem(AMB_KEY, JSON.stringify({ url, cols })); } catch {}
    set(cols);
  } catch {
    log('프로필 색 추출 실패 (이미지 접근 불가)');
    set(null);
  }
}

function updateHud() {
  applyAmbient(chInfo && chInfo.image ? chInfo.image : '');
  const hn = $('hudName');
  hn.textContent = chInfo && chInfo.name ? chInfo.name : (conn.channel ? '채널 이름 확인 중' : '채널 미설정');
  const img = $('hudImg');
  if (chInfo && chInfo.image) { img.src = chInfo.image; img.hidden = false; } else img.hidden = true;
  const c = $('hudConn');
  c.className = 'pill' + (connected ? ' on' : '');
  c.lastElementChild.textContent = connected ? '연결됨' : '끊김';
  const ph = $('hudPhase');
  ph.className = 'pill' + (state.phase === 'open' ? ' open' : state.phase === 'closed' ? ' closed' : ' idle');
  ph.lastElementChild.textContent = { idle: '대기', open: '접수 중', closed: '마감' }[state.phase];
}

function renderChInfo() {
  const box = $('chInfo');
  if (!connected && (!chInfo || !chInfo.name)) {
    box.hidden = true;
  } else {
    box.hidden = false;
    $('chName').textContent = chInfo && chInfo.name ? chInfo.name : '연결됨';
    const im = $('chImg');
    if (chInfo && chInfo.image) { im.src = chInfo.image; im.hidden = false; } else im.hidden = true;
  }
  updateHud();
}

async function loadChannelInfo(id) {
  try {
    const j = await getJson('https://api.chzzk.naver.com/service/v1/channels/' + id, true);
    const c = j && j.content;
    if (c && c.channelName && conn.channel === id) {
      chInfo = { name: c.channelName, image: c.channelImageUrl || '' };
      conn.info = chInfo;
      if (connected) saveConn();
      renderChInfo();
    }
  } catch {}
}

const prevCache = {};
let prevTimer = null;
function updatePrev() {
  clearTimeout(prevTimer);
  const box = $('chPrev');
  const m = $('channel').value.match(/[0-9a-f]{32}/i);
  if (!m || connected) { box.hidden = true; return; }
  const id = m[0].toLowerCase();
  const show = (c) => {
    if (!(($('channel').value.match(/[0-9a-f]{32}/i) || [''])[0].toLowerCase() === id)) return;
    box.hidden = false;
    const im = $('chPrevImg');
    if (c && c.image) { im.src = c.image; im.hidden = false; } else im.hidden = true;
    $('chPrevName').innerHTML = c ? '<b></b>' : '채널을 찾지 못했어요';
    if (c) $('chPrevName').firstChild.textContent = c.name;
  };
  if (prevCache[id] !== undefined) return show(prevCache[id]);
  box.hidden = false;
  $('chPrevImg').hidden = true;
  $('chPrevName').textContent = '확인 중...';
  prevTimer = setTimeout(async () => {
    let c = null;
    try {
      const j = await getJson('https://api.chzzk.naver.com/service/v1/channels/' + id, true);
      const x = j && j.content;
      if (x && x.channelName) c = { name: x.channelName, image: x.channelImageUrl || '' };
    } catch { prevCache[id] = undefined; return show(null); }
    prevCache[id] = c;
    show(c);
  }, 350);
}
$('channel').addEventListener('input', updatePrev);
$('channel').addEventListener('paste', () => setTimeout(updatePrev, 0));
setTimeout(updatePrev, 0);

function loadCache(id) {
  try {
    const c = JSON.parse(localStorage.getItem(CONN_KEY));
    if (c && c.channel === id && c.chatId && Date.now() - c.ts < CONN_TTL) {
      return { channel: id, chatId: c.chatId, token: c.token == null ? null : c.token, info: c.info || null, cached: true };
    }
  } catch {}
  return null;
}

function saveConn() {
  try {
    localStorage.setItem(CONN_KEY, JSON.stringify({ channel: conn.channel, chatId: conn.chatId, token: conn.token, info: conn.info || chInfo || null, ts: Date.now() }));
  } catch {}
}
let docked = false;

function applyDock(next) {
  const panel = $('connPanel'), bd = $('connBackdrop');
  if (panel.dataset.init && next === docked) return;
  const animate = !!panel.dataset.init;
  const first = panel.getBoundingClientRect();
  const ghost = animate ? panel.cloneNode(true) : null;
  docked = next;
  panel.dataset.init = '1';
  bd.classList.toggle('show', !docked);
  panel.classList.toggle('float', !docked);
  if (!animate || !ghost.animate) return;

  const last = panel.getBoundingClientRect();
  ghost.querySelectorAll('[id]').forEach((e) => e.removeAttribute('id'));
  const gi = ghost.querySelector('input');
  if (gi) gi.value = $('channel').value;
  Object.assign(ghost.style, {
    position: 'fixed', inset: 'auto', margin: '0', zIndex: '960', pointerEvents: 'none',
    left: first.left + 'px', top: first.top + 'px', width: first.width + 'px', height: first.height + 'px',
  });
  document.body.appendChild(ghost);
  panel.style.visibility = 'hidden';
  const px = (r) => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  const anim = ghost.animate([px(first), px(last)], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
  anim.onfinish = () => { ghost.remove(); panel.style.visibility = ''; };
}

$('connPanel').dataset.init = '1';
let lookupWin = null;
$('manualLink').addEventListener('click', (e) => {
  const left = Math.max(0, screen.availWidth - 540);
  const w = window.open($('manualLink').href, 'chzzk-lookup', 'popup=yes,width=520,height=720,left=' + left + ',top=60');
  if (w) {
    e.preventDefault();
    lookupWin = w;
    w.focus();
  }
});

$('btnSkip').onclick = () => applyDock(true);
$('channel').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnConn').click(); });

const liveUrl = (id) => `https://api.chzzk.naver.com/polling/v2/channels/${id}/live-status`;
const detailUrl = (id) => `https://api.chzzk.naver.com/service/v3/channels/${id}/live-detail`;
let manualAlt = false;
const tokenUrl = (cid) => `https://comm-api.game.naver.com/nng_main/v1/chats/access-token?channelId=${cid}&chatType=STREAMING`;

const ROUTES = [
  ['직접', (u) => u],
  ['corsproxy.io', (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u)],
  ['allorigins', (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)],
];
let routeIdx = 0;

function syncLock() {
  $('channel').disabled = connected || (want && !manualKind);
}

function setConn(on) {
  if (connected === on) return;
  connected = on;
  syncLock();
  updateHud();
  if (on) applyDock(true);
  $('conn').textContent = on ? '연결됨' : '끊김';
  $('conn').className = 'badge' + (on ? ' on' : '');
  $('btnConn').textContent = on ? '해제' : '연결';
  updatePrev();
  $('connPanel').classList.toggle('on', on);
  renderChInfo();
  log(on ? '채팅 연결됨' : '채팅 연결 끊김');
}

function showManual(kind, url) {
  manualKind = kind;
  clipTried = false;
  clipBase = null;
  $('manual').style.display = 'block';
  $('manual').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  startClipPoll();
  $('mtitle').textContent = kind === 'chat' ? '방송 정보 복사' : '인증 정보 복사';
  $('manualLink').href = url;
  $('manualJson').style.display = 'none';
  $('manualJson').value = '';
}

function hideManual() {
  $('manual').style.display = 'none';
  manualKind = '';
  stopClipPoll();
  try { if (lookupWin) lookupWin.close(); } catch {}
  lookupWin = null;
}

async function getJson(url, quiet) {
  const L = quiet ? () => {} : log;
  for (let k = 0; k < ROUTES.length; k++) {
    const i = (routeIdx + k) % ROUTES.length;
    L('조회 중 (' + ROUTES[i][0] + ')');
    try {
      const r = await fetch(ROUTES[i][1](url), { signal: AbortSignal.timeout(5000) });
      if (!r.ok) { L(ROUTES[i][0] + ' 실패: HTTP ' + r.status); continue; }
      const j = await r.json();
      routeIdx = i;
      return j;
    } catch { L(ROUTES[i][0] + ' 실패'); }
  }
  throw new Error('조회 실패');
}

function closeSocket() {
  clearInterval(pingTimer);
  clearTimeout(retryTimer);
  if (ws) {
    ws.onclose = null;
    try { ws.close(); } catch {}
    ws = null;
  }
}

async function startConnect() {
  const raw = $('channel').value.trim();
  const m = raw.match(/[0-9a-f]{32}/i);
  const id = m ? m[0] : raw;
  if (!id) return;
  $('channel').value = id;
  localStorage.setItem('cheese-roulette-channel', id);
  if (conn.channel !== id) conn = loadCache(id) || { channel: id, chatId: '', token: undefined };
  want = true;
  $('btnConn').disabled = true;
  $('btnConn').textContent = '연결 중...';
  syncLock();
  log('연결 시작: ' + id);
  if (conn.info) { chInfo = conn.info; renderChInfo(); } else loadChannelInfo(id);

  try {
    if (!conn.chatId) {
      try {
        const j = await getJson(liveUrl(id));
        conn.chatId = (j.content && j.content.chatChannelId) || '';
        if (!conn.chatId) {
          want = false;
          return log('채팅 채널을 찾지 못함 (방송 중인지, 채널 ID가 맞는지 확인)');
        }
      } catch {
        manualAlt = false;
        return showManual('chat', detailUrl(id));
      }
    }

    if (conn.token === undefined) {
      try { conn.token = (await getJson(tokenUrl(conn.chatId))).content.accessToken; }
      catch { conn.token = null; }
    }
    openSocket();
  } finally {
    $('btnConn').disabled = false;
    $('btnConn').textContent = connected ? '해제' : '연결';
    syncLock();
  }
}

function openSocket() {
  closeSocket();
  let ok = false;
  let sn = 0;
  for (const ch of String(conn.chatId)) sn += ch.charCodeAt(0);
  sn = (sn % 9) + 1;
  log(`채팅 서버 ss${sn} · 방 ${conn.chatId}`);
  const s = new WebSocket(`wss://kr-ss${sn}.chat.naver.com/chat`);
  ws = s;

  s.onopen = () => {
    s.send(JSON.stringify({
      ver: '3', cmd: 100, svcid: 'game', cid: conn.chatId, tid: 1,
      bdy: {
        uid: null, devType: 2001, accTkn: conn.token, auth: 'READ', libVer: '4.9.3',
        osVer: 'Windows/10', devName: 'Google Chrome/124.0', locale: 'ko', timezone: 'Asia/Seoul',
      },
    }));
    pingTimer = setInterval(() => {
      if (s.readyState === 1) s.send(JSON.stringify({ ver: '3', cmd: 0 }));
    }, 20000);
  };

  s.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    if (m.cmd === 0) s.send(JSON.stringify({ ver: '3', cmd: 10000 }));
    else if (m.cmd === 10100) {
      if (m.retCode && m.retCode !== 0) {
        log('채팅 인증 실패: ' + (m.retMsg || m.retCode));
        s.close();
      } else {
        ok = true;
        freshTries = 0;
        saveConn();
        setConn(true);
      }
    } else if (m.cmd === 93101 || m.cmd === 93102) {
      if (m.cmd === 93102) (window.__don = window.__don || []).push(m);
      for (const b of m.bdy || []) {
        let ex = null;
        try { ex = typeof b.extras === 'string' ? JSON.parse(b.extras) : b.extras; } catch {}
        const amount = ex ? Number(ex.payAmount) : 0;
        if (!(amount > 0)) {
          if (m.cmd === 93102) {
            if (ex && ex.isAnonymous) log('무시(익명 후원은 금액 미제공): ' + String(b.msg ?? '').slice(0, 40));
            else log('후원 형식 불명: ' + JSON.stringify(b).slice(0, 400));
          }
          continue;
        }
        let nick = ex.isAnonymous ? '' : ex.nickname || '';
        if (!ex.isAnonymous) try { nick = nick || JSON.parse(b.profile).nickname; } catch {}
        onDonation({ amount, message: String(b.msg ?? b.content ?? ''), nick });
      }
    }
  };

  s.onclose = () => {
    clearInterval(pingTimer);
    setConn(false);
    if (!want || ws !== s) return;
    if (ok) {
      retryTimer = setTimeout(openSocket, 5000);
    } else {
      want = false;
      syncLock();
      if (conn.cached || (conn.token && freshTries < 1)) {
        freshTries++;
        try { localStorage.removeItem(CONN_KEY); } catch {}
        conn = { channel: conn.channel, chatId: conn.cached ? '' : conn.chatId, token: undefined, info: conn.info };
        log('저장된 연결 정보가 만료됐어요. 새로 연결합니다');
        startConnect();
        return;
      }
      if (conn.token === null) showManual('token', tokenUrl(conn.chatId));
      else { conn.token = undefined; log('연결 실패'); }
    }
  };
}

function disconnectNow() {
  {
    want = false;
    closeSocket();
    setConn(false);
    hideManual();
    syncLock();
    applyDock(false);
    try { localStorage.removeItem(CONN_KEY); } catch {}
    conn = { channel: '', chatId: '', token: undefined };
    chInfo = null;
    renderChInfo();
  }
}
$('btnDisc').onclick = () => { if (state.phase !== 'open') disconnectNow(); };
$('btnConn').onclick = () => {
  if (connected) return state.phase === 'open' ? log('접수 중에는 연결 해제 불가') : disconnectNow();
  startConnect();
};

const manualRe = () => (manualKind === 'chat' ? /"chatChannelId"\s*:\s*"([^"]+)"/ : /"accessToken"\s*:\s*"([^"]+)"/);

function applyManual(text) {
  const raw = String(text || '');
  const m = raw.match(manualRe());
  if (!m) {
    if (manualKind === 'chat' && !manualAlt && /"content"/.test(raw)) {
      manualAlt = true;
      showManual('chat', liveUrl(conn.channel));
      return log('다른 주소로 한 번 더 복사해 주세요');
    }
    return log('복사한 내용이 맞지 않아요. 열린 창에서 Ctrl+A 후 Ctrl+C 해주세요');
  }
  if (manualKind === 'chat') {
    conn.chatId = m[1];
    const nm = raw.match(/"channelName"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    const im = raw.match(/"channelImageUrl"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    const dec = (v) => { try { return JSON.parse('"' + v + '"'); } catch { return v; } };
    if (nm) {
      conn.info = { name: dec(nm[1]), image: im ? dec(im[1]) : '' };
      chInfo = conn.info;
      renderChInfo();
    }
  } else {
    conn.token = m[1];
  }
  hideManual();
  startConnect();
}

$('btnPaste').onclick = async () => {
  try {
    applyManual(await navigator.clipboard.readText());
  } catch {
    $('manualJson').style.display = 'block';
    $('manualJson').focus();
    log('클립보드 접근이 막혔어요. 아래 칸에 Ctrl+V 해주세요');
  }
};

document.addEventListener('paste', (e) => {
  if (manualKind) applyManual(e.clipboardData.getData('text'));
});

window.addEventListener('focus', async () => {
  if (!manualKind) return;
  try {
    let state = '';
    try { state = (await navigator.permissions.query({ name: 'clipboard-read' })).state; } catch {}
    if (state !== 'granted') return;
    const t = await navigator.clipboard.readText();
    if (t !== clipBase && manualRe().test(t)) applyManual(t);
  } catch {}
});

state.items.forEach((it, i) => { if (it.ci == null) it.ci = i; });
state.nextCi = Math.max(state.nextCi || 0, ...state.items.map((i) => i.ci + 1), 0);

(() => {
  const sp = $('splitter'), root = document.documentElement, KEY_W = 'cheese-roulette-sidew';
  let cur = 0;
  const setW = (v) => {
    cur = Math.max(280, Math.min(Math.round(v), Math.round(innerWidth * 0.6)));
    root.style.setProperty('--side-w', cur + 'px');
  };
  try { const v = parseInt(localStorage.getItem(KEY_W), 10); if (v) setW(v); } catch {}

  sp.addEventListener('pointerdown', (e) => {
    sp.setPointerCapture(e.pointerId);
    sp.classList.add('drag');
    document.body.style.userSelect = 'none';
  });
  sp.addEventListener('pointermove', (e) => {
    if (sp.classList.contains('drag')) setW(e.clientX - 22);
  });
  const end = () => {
    if (!sp.classList.contains('drag')) return;
    sp.classList.remove('drag');
    document.body.style.userSelect = '';
    try { localStorage.setItem(KEY_W, String(cur)); } catch {}
  };
  sp.addEventListener('pointerup', end);
  sp.addEventListener('pointercancel', end);
  sp.addEventListener('dblclick', () => {
    cur = 0;
    root.style.removeProperty('--side-w');
    try { localStorage.removeItem(KEY_W); } catch {}
  });
  window.addEventListener('resize', () => { if (cur) setW(cur); });
  if (window.ResizeObserver) new ResizeObserver(() => fitHub($('hubName'), $('hub'))).observe(document.querySelector('.wheel-box'));
})();

function applyMuteUi() {
  const b = $('btnMute');
  b.classList.toggle('off', muted);
  b.title = muted ? '배경음 켜기' : '배경음 끄기';
  b.setAttribute('aria-label', b.title);
  const f = $('btnSfx');
  f.classList.toggle('off', sfxMuted);
  f.title = sfxMuted ? '효과음 켜기' : '효과음 끄기';
  f.setAttribute('aria-label', f.title);
}

$('btnSfx').onclick = () => {
  sfxMuted = !sfxMuted;
  try { localStorage.setItem('cheese-roulette-sfx-muted', sfxMuted ? '1' : '0'); } catch {}
  if (master) master.gain.setTargetAtTime(sfxMuted ? 0 : 1, actx.currentTime, 0.03);
  applyMuteUi();
};

let muteLong = false, muteTimer = null;
const mb = $('btnMute');
mb.addEventListener('pointerdown', () => {
  muteLong = false;
  clearTimeout(muteTimer);
  muteTimer = setTimeout(() => {
    muteLong = true;
    bgmStyle = (bgmStyle + 1) % BGM_STYLES.length;
    try { localStorage.setItem('cheese-roulette-bgm-style', String(bgmStyle)); } catch {}
    bgmStop();
    BGM.steps.wait = 0;
    syncBgm();
    showMuteTip(`BGM: ${BGM_STYLES[bgmStyle].name}`);
  }, 600);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => mb.addEventListener(ev, () => clearTimeout(muteTimer)));

function showMuteTip(text) {
  let tip = $('muteTip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'muteTip';
    tip.className = 'mutetip';
    mb.parentNode.appendChild(tip);
  }
  tip.textContent = text;
  tip.classList.remove('show');
  void tip.offsetWidth;
  tip.classList.add('show');
}

$('btnMute').onclick = () => {
  if (muteLong) { muteLong = false; return; }
  muted = !muted;
  try { localStorage.setItem('cheese-roulette-muted', muted ? '1' : '0'); } catch {}
  if (bgmMaster) bgmMaster.gain.setTargetAtTime(muted ? 0 : 1, actx.currentTime, 0.03);
  applyMuteUi();
  syncBgm();
};
applyMuteUi();

render();

{
  const saved = $('channel').value.match(/[0-9a-f]{32}/i);
  if (saved && loadCache(saved[0])) startConnect();
}
