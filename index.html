<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>치지직 유틸</title>
<style>
  :root { --bg:#14161a; --panel:#1d2025; --line:#2a2f37; --text:#e8eaed; --sub:#8b919a; --accent:#00ffa3; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,'Segoe UI','Noto Sans KR',sans-serif; }
  h1 { margin:0; font-size:28px; letter-spacing:.04em; }
  p { margin:6px 0 0; color:var(--sub); font-size:14px; text-align:center; }
  .menu { display:flex; flex-direction:column; gap:12px; width:min(100%,360px); }
  .btn { display:block; padding:18px 20px; border-radius:12px; border:1px solid var(--accent); background:rgba(0,255,163,.08); color:var(--accent); font-size:20px; font-weight:700; text-align:center; text-decoration:none; transition:background .15s, transform .15s; }
  .btn:hover { background:rgba(0,255,163,.18); transform:translateY(-2px); }
</style>
</head>
<body>
  <div>
    <h1>치지직 유틸</h1>
    <p>방송에 쓰는 도구 모음</p>
  </div>
  <nav class="menu">
    <a class="btn" href="cheese-roulette/">치즈 룰렛</a>
  </nav>
</body>
</html>
